name: 'Bug Report'
description: 'Report a bug to help us improve Bare AI CLI'
body:
  - type: 'markdown'
    attributes:
      value: |-
        > [!IMPORTANT]
        > Thanks for taking the time to fill out this bug report!
        >
        > Please search **[existing issues](https://github.com/Bare-Corporation/bare-ai-cli/issues)** to see if an issue already exists for the bug you encountered.

  - type: 'textarea'
    id: 'problem'
    attributes:
      label: 'What happened?'
      description: 'A clear and concise description of what the bug is.'
    validations:
      required: true

  - type: 'textarea'
    id: 'expected'
    attributes:
      label: 'What did you expect to happen?'
    validations:
      required: true

  - type: 'textarea'
    id: 'info'
    attributes:
      label: 'Client information'
      description: 'Please paste the full text from the `/about` command run from Bare AI CLI. Also include which platform (macOS, Windows, Linux). Note that this output contains your email address. Consider removing it before submitting.'
      value: |-
        <details>
        <summary>Client Information</summary>

        Run `bare` to enter the interactive CLI, then run the `/about` command.

        ```console
        > /about
        # paste output here
        ```

        </details>
    validations:
      required: true

  - type: 'textarea'
    id: 'login-info'
    attributes:
      label: 'Login information'
      description: 'Describe how you are authenticating (e.g. a Bare AI or provider API key, a local endpoint). Do not paste the key itself.'

  - type: 'textarea'
    id: 'additional-context'
    attributes:
      label: 'Anything else we need to know?'
      description: 'Add any other context about the problem here.'
